name: Feature request
description: Suggest a new feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: What is the use case? What would be possible after this change that isn't possible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to look in practice? Example CLI invocations or YAML snippets help a lot.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools or workarounds you've tried, and why they fall short.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, screenshots, related issues, etc.
