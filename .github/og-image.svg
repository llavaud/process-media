<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1115"/>
  
  <!-- Subtle Background elements -->
  <circle cx="1050" cy="50" r="300" fill="#0284c7" opacity="0.15" filter="url(#blur)"/>
  
  <!-- Top Accent Bar -->
  <rect width="1200" height="8" fill="#38bdf8"/>

  <g transform="translate(80, 175)">
    <!-- Logo / Icon -->
    <g transform="scale(3.5) translate(0, -7)" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 4h-6L6.5 7H3a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5L15 4z"/>
      <circle cx="12" cy="13" r="3"/>
    </g>

    <!-- Title -->
    <text x="110" y="45" font-family="sans-serif" font-size="64" font-weight="700" fill="#f3f4f6">process-media</text>
    
    <!-- Version badge -->
    <rect x="580" y="4" width="110" height="44" rx="22" fill="#1e293b"/>
    <text x="635" y="33" font-family="sans-serif" font-size="20" font-weight="600" fill="#38bdf8" text-anchor="middle">v2.0.1</text>

    <!-- Tagline -->
    <text x="0" y="160" font-family="sans-serif" font-size="44" font-weight="400" fill="#e2e8f0">Rename and process photos and videos</text>
    <text x="0" y="225" font-family="sans-serif" font-size="44" font-weight="400" fill="#e2e8f0">from their EXIF capture date.</text>

    <!-- Divider -->
    <line x1="0" y1="320" x2="1040" y2="320" stroke="#1e293b" stroke-width="2"/>

    <!-- Tech Stack / Footer -->
    <g transform="translate(0, 395)">
      <!-- Python -->
      <text x="0" y="0" font-family="sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Python 3.11+</text>
      
      <!-- Dot -->
      <circle cx="205" cy="-8" r="4" fill="#38bdf8"/>
      
      <!-- License -->
      <text x="240" y="0" font-family="sans-serif" font-size="28" font-weight="500" fill="#94a3b8">MIT License</text>
      
      <!-- Dot -->
      <circle cx="420" cy="-8" r="4" fill="#38bdf8"/>
      
      <!-- Debian -->
      <text x="455" y="0" font-family="sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Debian package</text>
    </g>
  </g>
</svg>
