[project]
name = "process-media"
version = "2.0.0"
description = "Rename and process photos and videos from their EXIF metadata"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [ { name="Laurent Lavaud" } ]

dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pillow>=10.3",
  "pyexiftool>=0.5",
  "rich>=13.7",
]

[project.optional-dependencies]
# HEIC/HEIF photo support (Apple devices). Optional because libheif is
# a heavy native dependency.
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "pillow-heif>=0.16"]

[project.scripts]
process-media = "process_media.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_media"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
